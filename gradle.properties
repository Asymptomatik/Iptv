# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# ── JVM ───────────────────────────────────────────────────────────────────
# Increase heap for Kotlin/Compose compilation
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8

# ── Build performance ──────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true

# ── AndroidX ──────────────────────────────────────────────────────────────
android.useAndroidX=true

# ── Kotlin ────────────────────────────────────────────────────────────────
kotlin.code.style=official

# ── R classes ─────────────────────────────────────────────────────────────
# Prevents resource name conflicts across modules and speeds up compilation
android.nonTransitiveRClass=true

# ── Build Config ──────────────────────────────────────────────────────────
# Suppress deprecated BuildConfig generation warning
android.defaults.buildfeatures.buildconfig=false
