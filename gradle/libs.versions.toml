# Version Catalog — IptvApp
# Centralises all dependency versions for the project.
# Referenced by build.gradle.kts files via libs.*

[versions]
# Build toolchain
agp = "8.6.1"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.27"

# Compose
compose-bom = "2024.10.01"

# AndroidX core / architecture
activity-compose = "1.9.3"
navigation-compose = "2.8.4"
lifecycle = "2.8.6"

# Dependency injection
hilt = "2.52"
hilt-navigation-compose = "1.2.0"

# Video / media
media3 = "1.4.1"

# Image loading
coil = "2.7.0"

# Local persistence
room = "2.6.1"
datastore = "1.1.1"

# Network
retrofit = "2.11.0"
okhttp = "4.12.0"
retrofit-kotlinx-serialization-converter = "1.0.0"

# Serialization
kotlinx-serialization-json = "1.7.3"

# Coroutines
coroutines = "1.9.0"

# Compose for TV
tv-compose = "1.0.0"

# Testing
junit = "4.13.2"
junit-ext = "1.2.1"
espresso = "3.6.1"
turbine = "1.2.0"
mockk = "1.13.12"


[libraries]
# ── Compose BOM (governs all androidx.compose.* versions) ──────────────────
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }

# ── Activity ───────────────────────────────────────────────────────────────
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }

# ── Navigation ─────────────────────────────────────────────────────────────
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# ── Lifecycle / ViewModel ──────────────────────────────────────────────────
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# ── Hilt ───────────────────────────────────────────────────────────────────
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# ── Media3 / ExoPlayer ────────────────────────────────────────────────────
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
media3-database = { group = "androidx.media3", name = "media3-database", version.ref = "media3" }
# media3-exoplayer-ffmpeg — INTENTIONALLY NOT DECLARED (Task 12).
# `androidx.media3:media3-exoplayer-ffmpeg` is not published on Maven Central or Google's
# Maven repository for ANY media3 version — verified while implementing Task 12:
#   curl https://dl.google.com/dl/android/maven2/androidx/media3/media3-exoplayer-ffmpeg/1.4.1/... -> 404
#   curl https://repo1.maven.org/maven2/androidx/media3/media3-exoplayer-ffmpeg/1.4.1/...        -> 404
#   dl.google.com androidx/media3 group-index.xml contains no "ffmpeg" entry at all
# This extension must be built locally from the media3 source tree
# (libraries/decoder_ffmpeg + build_ffmpeg.sh) and published to mavenLocal(), or included
# as a composite build / local project. Do NOT re-add a version.ref alias here without
# first adding a resolvable repository for it. See ADR-004 and
# com.bobot.iptvapp.player.PlayerManager / ExoPlayerManager KDoc for the decoupled design
# that lets this extension be wired in later without touching call sites.

# ── Coil ───────────────────────────────────────────────────────────────────
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# ── Room ───────────────────────────────────────────────────────────────────
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# ── DataStore ──────────────────────────────────────────────────────────────
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ── Network ────────────────────────────────────────────────────────────────
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit-kotlinx-serialization-converter = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofit-kotlinx-serialization-converter" }

# ── Serialization ──────────────────────────────────────────────────────────
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }

# ── Coroutines ─────────────────────────────────────────────────────────────
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# ── Compose for TV ────────────────────────────────────────────────────────
tv-foundation = { group = "androidx.tv", name = "tv-foundation", version.ref = "tv-compose" }
tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tv-compose" }

# ── Testing ────────────────────────────────────────────────────────────────
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-ext = { group = "androidx.test.ext", name = "junit", version.ref = "junit-ext" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }


[bundles]
# Convenience bundles used in app/build.gradle.kts

compose-core = [
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
    "compose-material3",
    "compose-runtime",
    "compose-foundation",
    "compose-foundation-layout",
    "compose-animation",
]

lifecycle = [
    "lifecycle-runtime-ktx",
    "lifecycle-runtime-compose",
    "lifecycle-viewmodel-compose",
    "lifecycle-viewmodel-ktx",
]

media3 = [
    "media3-exoplayer",
    "media3-exoplayer-hls",
    "media3-ui",
    "media3-session",
    "media3-datasource-okhttp",
    "media3-database",
]

room = [
    "room-runtime",
    "room-ktx",
]

network = [
    "retrofit",
    "okhttp",
    "okhttp-logging",
    "retrofit-kotlinx-serialization-converter",
    "kotlinx-serialization-json",
]

tv = [
    "tv-foundation",
    "tv-material",
]


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Kotlin 2.x: Compose compiler is bundled; this plugin wires it automatically.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
